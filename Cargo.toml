[package]
name = "bio-assets"
version = "0.1.0"
edition = "2024"
description = "Offline scientific SVG asset library with a tiny MCP API"
license = "MIT"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
fs2 = "0.4"
percent-encoding = "2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rmcp = { version = "3.4.1", features = ["transport-streamable-http-server"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
xmltree = "0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
